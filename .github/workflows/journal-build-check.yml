name: Journal Build Check

on:
  push:
    branches:
      - journal/t6-montage-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-build-check:
    name: Build site without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee journal-build.log

      - name: Test Journal layout algorithm
        shell: bash
        run: pnpm exec tsx --test scripts/journal-layout.test.ts

      - name: Build Astro site and run Pagefind
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee -a journal-build.log

      - name: Verify Winter Tulip side classes in generated HTML
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const file = 'dist/blog/07-10-2026-the-winter-tulip-s-breakthrough/index.html';
          const html = readFileSync(file, 'utf8');
          const classAttributes = [...html.matchAll(/class=["']([^"']*\\bjournal-image-(left|right)\\b[^"']*)["']/g)];
          const sides = classAttributes.map(([, , side]) => side === 'left' ? 'L' : 'R');
          console.log(`Winter Tulip generated HTML: ${file}`);
          console.log(`Photo side sequence: ${sides.join('-') || '(no side classes found)'}`);
          if (sides.join('') !== 'LRR') {
            console.error('Expected photo side sequence L-R-R in generated HTML.');
            process.exit(1);
          }
          NODE

      - name: Upload Winter Tulip HTML for inspection
        uses: actions/upload-artifact@v4
        with:
          name: journal-tulip-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/blog/07-10-2026-the-winter-tulip-s-breakthrough/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-build-output
          path: journal-build.log
          if-no-files-found: warn
          retention-days: 7
