name: Journal Build Check

on:
  push:
    branches:
      - journal/t6-montage-validation
      - integrate/journal-layout-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-build-check:
    name: Build site without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee journal-build.log

      - name: Report verified dimensions for Journal source images
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";
          import sharp from "sharp";

          const blogDir = "src/content/blog";
          const archiveDir = "src/content/archive";
          const imageRoot = "public";
          const names = (await readdir(blogDir)).filter((name) => name.endsWith(".md") || name.endsWith(".mdx"));
          const articles = [];
          for (const name of names) {
            const raw = await readFile(join(blogDir, name), "utf8");
            const frontmatter = raw.match(/^---\n([\s\S]*?)\n---/);
            if (!frontmatter || !/^category:\s*["']?journal["']?\s*$/m.test(frontmatter[1]) || /^draft:\s*true\s*$/m.test(frontmatter[1])) continue;
            const compositionLine = frontmatter[1].split("\n").find((line) => line.startsWith("composition: "));
            if (!compositionLine) continue;
            const composition = JSON.parse(compositionLine.slice("composition: ".length));
            articles.push({ name, composition });
          }
          articles.sort((a, b) => a.name.localeCompare(b.name));
          for (const article of articles) {
            console.log(`ARTICLE ${article.name}`);
            for (const block of article.composition) {
              if (block.type !== "source") continue;
              const source = await readFile(join(archiveDir, `${block.source_id}.md`), "utf8");
              const imageMatch = source.match(/^image:\s*["']?([^"'\n]+)["']?\s*$/m);
              if (!imageMatch) throw new Error(`Missing image path for ${block.source_id}`);
              const imagePath = imageMatch[1].trim();
              const metadata = await sharp(join(imageRoot, imagePath.replace(/^\/+/, ""))).metadata();
              if (!metadata.width || !metadata.height) throw new Error(`Missing dimensions for ${block.source_id}`);
              const orientation = metadata.height > metadata.width ? "V" : metadata.width > metadata.height ? "H" : "S";
              console.log(`  ${block.source_id},${imagePath},${metadata.width}x${metadata.height},${orientation}`);
            }
          }
          NODE

      - name: Test Journal layout algorithm and integrity contract
        run: pnpm test:journal:layout

      - name: Build Astro site and run Pagefind
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee -a journal-build.log

      - name: Run real Chromium visual check for the Effigy article
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t15-browser /tmp/t15-browser-site/pekht-archive-site /tmp/t15-browser-results
          cp -a dist/. /tmp/t15-browser-site/pekht-archive-site/
          npm install --prefix /tmp/t15-browser playwright@1.56.1
          /tmp/t15-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 4173 --directory /tmp/t15-browser-site >/tmp/t15-browser-http.log 2>&1 &
          echo $! >/tmp/t15-browser-http.pid
          trap 'kill "$(cat /tmp/t15-browser-http.pid)" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/pekht-archive-site/blog/16-10-2026-the-effigy-from-stitch-to-relic/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "/tmp/t15-browser/node_modules/playwright/index.mjs";
          import { writeFile } from "node:fs/promises";
          const url = "http://127.0.0.1:4173/pekht-archive-site/blog/16-10-2026-the-effigy-from-stitch-to-relic/";
          const browser = await chromium.launch({ headless: true });
          const report = { url, viewports: [], errors: [] };
          try {
            for (const viewport of [{ name: "desktop", width: 1440, height: 1100 }, { name: "mobile", width: 390, height: 844 }]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
              page.on("pageerror", error => report.errors.push(viewport.name + " pageerror: " + error.message));
              page.on("console", message => { if (message.type() === "error") report.errors.push(viewport.name + " console: " + message.text()); });
              await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });
              await page.locator("body").evaluate(async body => {
                const step = Math.max(300, Math.floor(window.innerHeight * 0.8));
                for (let y = 0; y < body.scrollHeight; y += step) {
                  window.scrollTo(0, y);
                  await new Promise(resolve => setTimeout(resolve, 100));
                }
                window.scrollTo(0, 0);
                await new Promise(resolve => setTimeout(resolve, 500));
              });
              const data = await page.evaluate(() => ({
                title: document.title,
                h1: document.querySelector("h1")?.innerText ?? null,
                bridges: [...document.querySelectorAll(".journal-bridge")].map(el => ({ text: el.innerText.trim(), textAlign: getComputedStyle(el).textAlign, width: Math.round(el.getBoundingClientRect().width) })),
                images: [...document.querySelectorAll("main img, article img")].map(img => ({ src: img.currentSrc || img.src, loaded: img.complete && img.naturalWidth > 0, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight })),
                bodyWidth: document.body.scrollWidth,
                viewportWidth: window.innerWidth
              }));
              await page.screenshot({ path: "/tmp/t15-browser-results/effigy-" + viewport.name + ".png", fullPage: true });
              report.viewports.push({ ...viewport, ...data });
              await page.close();
            }
          } finally {
            await browser.close();
          }
          await writeFile("/tmp/t15-browser-results/report.json", JSON.stringify(report, null, 2) + "\n");
          const issues = [];
          if (report.viewports.length !== 2) issues.push("Both desktop and mobile viewports were not captured.");
          for (const v of report.viewports) {
            if (!v.h1) issues.push(v.name + ": missing h1");
            if (v.bridges.length < 2) issues.push(v.name + ": expected at least two journal bridges, found " + v.bridges.length);
            if (!v.images.length) issues.push(v.name + ": no article images found");
            if (v.images.some(img => !img.loaded)) issues.push(v.name + ": one or more article images failed to load");
            if (v.bodyWidth > v.viewportWidth) issues.push(v.name + ": horizontal overflow (" + v.bodyWidth + " > " + v.viewportWidth + ")");
          }
          if (report.errors.length) issues.push(...report.errors);
          if (issues.length) {
            console.error("T15 browser visual check failed:\n" + issues.join("\n"));
            process.exitCode = 1;
          } else {
            console.log("T15 browser visual check passed: desktop/mobile screenshots, bridges, loaded article images, no horizontal overflow, no browser errors.");
            for (const v of report.viewports) console.log(v.name + ": " + v.bridges.length + " bridges, " + v.images.length + " images, body width " + v.bodyWidth + "/" + v.viewportWidth);
          }
          NODE

      - name: Upload T15 browser visual-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t15-effigy-browser-visual-check
          path: /tmp/t15-browser-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Package compact Journal visual-check artifact
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { cp, mkdir, readFile, stat, writeFile } from "node:fs/promises";
          import { extname, join, resolve } from "node:path";

          const dist = resolve("dist");
          const out = resolve("journal-visual-check");
          const base = "pekht-archive-site";
          const ids = [
            "07-10-2026-the-winter-tulip-s-breakthrough",
            "08-10-2026-every-line-costs-light",
            "09-10-2026-the-original-draft",
            "09-10-2026-the-unkillable-king-a-hellebore-s-winter-gambit",
            "10-10-2026-the-percussion-engineer",
            "11-10-2026-the-petunia-and-the-monolith",
            "14-10-2026-the-water-under-the-cathedral-of-ice",
            "15-10-2026-frost-s-ephemeral-cathedral",
          ];
          const assetExts = new Set([
            ".css", ".js", ".mjs", ".json", ".png", ".jpg", ".jpeg", ".webp",
            ".avif", ".gif", ".svg", ".ico", ".woff", ".woff2", ".ttf", ".otf",
            ".mp4", ".webm",
          ]);
          const siteRoot = join(out, base);
          const queued = [];
          const copied = new Set();
          let totalBytes = 0;

          await mkdir(siteRoot, { recursive: true });

          function resolveUrl(raw, logicalBase) {
            const value = raw.trim().replace(/^["']|["']$/g, "");
            if (!value || /^(?:data|https?:|mailto:|tel:|javascript:|#)/i.test(value)) return null;
            let url;
            try {
              url = new URL(value, "https://visual-check.invalid/" + logicalBase);
            } catch {
              return null;
            }
            if (url.origin !== "https://visual-check.invalid") return null;
            let pathname = decodeURIComponent(url.pathname);
            if (pathname === "/" + base) pathname = "/";
            else if (pathname.startsWith("/" + base + "/")) pathname = pathname.slice(base.length + 1);
            const rel = pathname.replace(/^\/+/, "");
            if (!rel || rel.split("/").includes("..")) return null;
            return rel;
          }

          async function addAsset(raw, logicalBase) {
            const rel = resolveUrl(raw, logicalBase);
            if (!rel || !assetExts.has(extname(rel).toLowerCase())) return;
            if (copied.has(rel) || queued.some((item) => item.rel === rel)) return;
            try {
              const info = await stat(join(dist, rel));
              if (!info.isFile()) return;
              queued.push({ rel, logicalBase: base + "/" + rel });
            } catch {
              throw new Error("Referenced visual-check asset is missing from dist: " + rel);
            }
          }

          function htmlReferences(html) {
            const refs = [];
            for (const match of html.matchAll(/\b(?:src|href|poster)\s*=\s*["']([^"']+)["']/gi)) refs.push(match[1]);
            for (const match of html.matchAll(/\bsrcset\s*=\s*["']([^"']+)["']/gi)) {
              for (const entry of match[1].split(",")) refs.push(entry.trim().split(/\s+/)[0]);
            }
            return refs;
          }

          async function enqueueTextAsset(rel, text) {
            const ext = extname(rel).toLowerCase();
            const refs = [];
            if (ext === ".css") {
              for (const match of text.matchAll(/url\(\s*(['"]?)(.*?)\1\s*\)/gi)) refs.push(match[2]);
              for (const match of text.matchAll(/@import\s+(?:url\()?\s*["']([^"']+)["']/gi)) refs.push(match[1]);
            } else if (ext === ".js" || ext === ".mjs") {
              for (const match of text.matchAll(/(?:from|import)\s*["']([^"']+\.(?:m?js|css)(?:\?[^"']*)?)["']/g)) refs.push(match[1]);
              for (const match of text.matchAll(/import\(\s*["']([^"']+\.(?:m?js|css)(?:\?[^"']*)?)["']\s*\)/g)) refs.push(match[1]);
            }
            for (const ref of refs) await addAsset(ref, base + "/" + rel);
          }

          for (const id of ids) {
            const rel = "blog/" + id + "/index.html";
            const source = join(dist, rel);
            const html = await readFile(source, "utf8");
            const target = join(siteRoot, rel);
            await mkdir(join(siteRoot, "blog", id), { recursive: true });
            await cp(source, target);
            totalBytes += (await stat(source)).size;
            for (const ref of htmlReferences(html)) await addAsset(ref, base + "/" + rel);
          }

          while (queued.length) {
            const { rel, logicalBase } = queued.shift();
            if (copied.has(rel)) continue;
            const source = join(dist, rel);
            const target = join(siteRoot, rel);
            await mkdir(join(target, ".."), { recursive: true });
            await cp(source, target);
            copied.add(rel);
            const info = await stat(source);
            totalBytes += info.size;
            if ([".css", ".js", ".mjs"].includes(extname(rel).toLowerCase())) {
              await enqueueTextAsset(rel, await readFile(source, "utf8"));
            }
          }

          const links = ids.map((id) => '<li><a href="/' + base + '/blog/' + id + '/">' + id + '</a></li>').join("\n");
          await writeFile(join(out, "index.html"), '<!doctype html><meta charset="utf-8"><title>Journal visual check</title><h1>Journal visual check — 8 articles</h1><p>Serve this folder over HTTP; then open this page.</p><ol>' + links + '</ol>\n');
          await writeFile(join(out, "README.txt"), "Compact visual-check artifact for eight Journal articles.\nServe this folder over HTTP (for example: python -m http.server 8000) and open http://localhost:8000/ . The site base path is preserved under /" + base + "/.\n");
          console.log("Journal visual-check artifact: " + ids.length + " article pages, " + copied.size + " assets, " + totalBytes + " bytes before ZIP compression.");
          NODE

      - name: Upload compact Journal visual-check artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: journal-integration-visual-check
          path: journal-visual-check/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-build-output
          path: journal-build.log
          if-no-files-found: warn
          retention-days: 7
