name: Journal Montage Validation

on:
  push:
    branches:
      - journal/t6-montage-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-validation:
    name: Validate Journal montage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run montage validation tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:journal:validation 2>&1 | tee journal-validation.log

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-validation-output
          path: journal-validation.log
          if-no-files-found: warn
          retention-days: 7
