name: explore-preview-dispatcher (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Explore experiment
        uses: actions/checkout@v4
        with:
          ref: explore-preview-test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check POS tagging in context
        run: pnpm exec tsx scripts/explore-nlp-context-test.ts

      - name: Run full Explore A2
        run: pnpm exec tsx scripts/explore-preview-a2.ts
