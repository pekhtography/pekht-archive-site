name: cookie-free search engine test

on:
  push:
    branches: [main-clean]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query search engines
        run: |
          set -euo pipefail

          for engine in google bing ddg; do
            echo "===== $engine ====="
            case "$engine" in
              google)
                url='https://www.google.com/search?q=site%3Ax.com%2FPEKHTography%2Fstatus+%22Rain+hit%22+PEKHTography'
                ;;
              bing)
                url='https://www.bing.com/search?q=site%3Ax.com%2FPEKHTography%2Fstatus+%22Rain+hit%22+PEKHTography'
                ;;
              ddg)
                url='https://html.duckduckgo.com/html/?q=site%3Ax.com%2FPEKHTography%2Fstatus+%22Rain+hit%22+PEKHTography'
                ;;
            esac

            curl -L --fail --silent --show-error --max-time 30 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              "$url" > "/tmp/$engine.html"

            echo "Bytes: $(wc -c < "/tmp/$engine.html")"
            echo "Query text hits:"
            grep -io 'Rain hit\|PEKHTography' "/tmp/$engine.html" | sort | uniq -c | head -20 || true
            echo "Decoded X status URLs:"
            python3 - "/tmp/$engine.html" <<'PY'
import html, re, sys, urllib.parse
s=open(sys.argv[1],encoding="utf-8",errors="ignore").read()
s=html.unescape(s)
for _ in range(2):
    s=urllib.parse.unquote(s)
urls=sorted(set(re.findall(r'https?://(?:x|twitter)\.com/[^"<> ]+/status/[0-9]{15,}', s, re.I)))
for u in urls[:50]:
    print(u)
PY
          done
