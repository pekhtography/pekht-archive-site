name: Journal Testability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-test:
    name: Isolated Journal harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated Journal test harness
        shell: bash
        run: |
          set -o pipefail
          pnpm journal:test 2>&1 | tee journal-test.log

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-test-output
          path: journal-test.log
          if-no-files-found: warn
          retention-days: 7
