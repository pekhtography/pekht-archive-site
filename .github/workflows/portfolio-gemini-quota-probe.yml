name: Portfolio Gemini Single-Request Quota Probe

on:
  push:
    branches:
      - portfolio/lifecycle-amendment-1-integration-harness
    paths:
      - .github/workflows/portfolio-gemini-quota-probe.yml
  workflow_dispatch:
    inputs:
      model:
        description: "Optional model override; blank uses the repository GEMINI_MODEL variable"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-gemini-single-quota-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quota-probe:
    name: One Gemini request (no retries or fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected feature ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Send exactly one Gemini request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
          GEMINI_PROBE_RESULT_PATH: gemini-quota-probe-result.json
        run: pnpm exec tsx scripts/portfolio/gemini-quota-probe.ts

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-gemini-quota-probe-${{ github.run_id }}
          path: gemini-quota-probe-result.json
          if-no-files-found: warn
          retention-days: 30
