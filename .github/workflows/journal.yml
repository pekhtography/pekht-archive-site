name: Journal

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pekhtography-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Journal
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_1: ${{ vars.GEMINI_FALLBACK_1 }}
          GEMINI_FALLBACK_2: ${{ vars.GEMINI_FALLBACK_2 }}
          GEMINI_FALLBACK_3: ${{ vars.GEMINI_FALLBACK_3 }}
          GEMINI_FALLBACK_4: ${{ vars.GEMINI_FALLBACK_4 }}
        run: |
          if pnpm journal; then
            echo "outcome=COMPLETED" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "outcome=INCOMPLETE" >> "$GITHUB_OUTPUT"
              echo "::warning::Journal orchestration ended without a complete result."
            else
              echo "outcome=ERROR" >> "$GITHUB_OUTPUT"
              exit "$status"
            fi
          fi

      - name: Commit Journal entry
        id: publish
        if: steps.generate.outputs.outcome == 'COMPLETED'
        run: |
          if [ -z "$(git status --porcelain -- src/content/blog)" ]; then
            echo "No new Journal entry."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "feat: publish Journal entry"

          # Generation can take a long time while other commits land on main.
          # Rebase the Journal commit onto the latest main and retry non-fast-forward
          # pushes. Never force-push or discard newer remote commits.
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Journal publication conflicts with newer main changes. No remote changes were overwritten."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Push attempt $attempt/$max_attempts failed; fetching main and retrying."
            fi
          done

          echo "::error::Could not publish Journal after $max_attempts attempts. No force-push was used."
          exit 1

      - name: Summarize Journal outcome
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outputs.outcome }}
          GENERATE_STEP_OUTCOME: ${{ steps.generate.outcome }}
          PUBLISH_STEP_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          if [ "$GENERATE_OUTCOME" = "INCOMPLETE" ]; then
            echo "## INCOMPLETE" >> "$GITHUB_STEP_SUMMARY"
            echo "Journal generation could not complete. No partial material was published." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Journal run is INCOMPLETE (model chain or orchestration budget exhausted)."
            exit 1
          fi

          if [ "$GENERATE_STEP_OUTCOME" = "failure" ]; then
            echo "## ERROR" >> "$GITHUB_STEP_SUMMARY"
            echo "Journal generation failed due to an unexpected technical error." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$PUBLISH_STEP_OUTCOME" = "failure" ]; then
            echo "## PUBLISH_ERROR" >> "$GITHUB_STEP_SUMMARY"
            echo "Journal entry was generated but could not be committed and pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$PUBLISHED" = "true" ]; then
            echo "## PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
            echo "A new Journal entry was committed to main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## NO_JOURNAL" >> "$GITHUB_STEP_SUMMARY"
            echo "The run completed normally, but no publishable Journal entry was selected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger site deployment
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pekhtography-preview.yml --ref main
