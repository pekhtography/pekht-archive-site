name: Journal

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: pekhtography-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Journal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_1: ${{ vars.GEMINI_FALLBACK_1 }}
          GEMINI_FALLBACK_2: ${{ vars.GEMINI_FALLBACK_2 }}
          GEMINI_FALLBACK_3: ${{ vars.GEMINI_FALLBACK_3 }}
          GEMINI_FALLBACK_4: ${{ vars.GEMINI_FALLBACK_4 }}
        run: pnpm journal

      - name: Commit Journal entry
        id: publish
        run: |
          if [ -z "$(git status --porcelain -- src/content/blog)" ]; then
            echo "No new Journal entry."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "feat: publish Journal entry"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site deployment
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pekhtography-preview.yml --ref main
