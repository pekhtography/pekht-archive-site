name: Portfolio Orchestrator Tests

on:
  push:
    branches:
      - portfolio/orchestrator-v1

permissions:
  contents: read

jobs:
  portfolio-orchestrator-test:
    name: Portfolio orchestrator tests (mock only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Portfolio orchestrator tests (mock only)
        run: pnpm exec tsx --test scripts/portfolio/provider.test.ts scripts/portfolio/orchestrator.test.ts
