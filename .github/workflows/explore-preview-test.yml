name: explore-preview-test (experimental, do not merge to main)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: explore-preview-test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run MMR experiment
        run: pnpm exec tsx scripts/explore-mmr-experiment.ts

      - name: Build Astro site
        run: pnpm build
