name: explore-preview-test (experimental, do not merge to main)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: explore-preview-test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run MMR experiment
        run: pnpm exec tsx scripts/explore-mmr-experiment.ts

      - name: Build Astro site
        run: pnpm build

      - name: Upload Explore build artifact
        uses: actions/upload-artifact@v4
        with:
          name: explore-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Prepare lightweight Explore preview
        run: |
          rm -rf explore-preview-lite
          mkdir -p explore-preview-lite
          find dist -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' \) -print0 | while IFS= read -r -d '' file; do
            target="explore-preview-lite/$file"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done

      - name: Upload lightweight Explore preview
        uses: actions/upload-artifact@v4
        with:
          name: explore-preview-lite
          path: explore-preview-lite
          if-no-files-found: error
          retention-days: 3
