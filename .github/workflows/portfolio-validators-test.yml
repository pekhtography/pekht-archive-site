name: Portfolio Validators Test

on:
  push:
    branches:
      - portfolio/validators-v1
    paths:
      - 'scripts/portfolio/**'
      - '.github/workflows/portfolio-validators-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/portfolio/**'
      - '.github/workflows/portfolio-validators-test.yml'

permissions:
  contents: read

jobs:
  portfolio-validators-test:
    name: Portfolio validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Portfolio validator tests
        run: pnpm exec tsx --test scripts/portfolio/validation/*.test.ts
