name: PEKHTOGRAPHY archive collector

# First live collector test trigger.
# Force schedule re-registration check.

on:
  push:
    branches:
      - main-clean
    paths:
      - ".github/workflows/archive-collector.yml"
      - "scripts/archive-collect.ts"
      - "scripts/archive-add.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: pekhtography-archive-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main-clean
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Install x-cli
        run: |
          go install github.com/tamnd/x-cli/cmd/x@v0.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Import X session
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          printf 'Cookie: auth_token=%s; ct0=%s\n' "$X_AUTH_TOKEN" "$X_CT0" | x auth import
          x auth status

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Run incremental collector
        run: pnpm archive:collect

      - name: Commit archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml src/content/archive public/images/archive

          if git diff --staged --quiet; then
            echo "No archive changes."
            exit 0
          fi

          git commit -m "feat: sync new PEKHTOGRAPHY posts"
          AUREUS_INTERNAL_PUSH=true git push origin HEAD:main-clean
