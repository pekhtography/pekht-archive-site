name: Portfolio Lifecycle Amendment 1 Contracts

on:
  push:
    branches:
      - portfolio/lifecycle-amendment-1-contracts
    paths:
      - "validation/portfolio-lifecycle-amendment-1/**"
      - "scripts/portfolio/validation/lifecycle-amendment-1-contracts.ts"
      - ".github/workflows/portfolio-lifecycle-amendment-1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-lifecycle-amendment-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Ajv fixtures and TypeScript contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: validation/portfolio-lifecycle-amendment-1/package-lock.json

      - name: Install locked dependencies
        working-directory: validation/portfolio-lifecycle-amendment-1
        run: npm ci --no-audit --no-fund

      - name: Compile all Draft 2020-12 schemas with Ajv 8.17.1
        working-directory: validation/portfolio-lifecycle-amendment-1
        run: npm run validate:schema

      - name: Run positive and negative fixture tests
        working-directory: validation/portfolio-lifecycle-amendment-1
        run: npm run test:full

      - name: TypeScript typecheck
        working-directory: validation/portfolio-lifecycle-amendment-1
        run: npm run typecheck
