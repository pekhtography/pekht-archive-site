name: Portfolio Snapshot Tests

on:
  workflow_dispatch:
  push:
    branches:
      - portfolio/orchestrator-v1
      - portfolio/lifecycle-amendment-1-integration-harness
    paths:
      - 'scripts/portfolio/**'
      - 'src/lib/stratified-sample.ts'
      - 'src/lib/explore-sort.ts'
      - '.github/workflows/portfolio-snapshot-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/portfolio/**'
      - 'src/lib/stratified-sample.ts'
      - 'src/lib/explore-sort.ts'
      - '.github/workflows/portfolio-snapshot-test.yml'

permissions:
  contents: read

jobs:
  portfolio-snapshot-test:
    name: Portfolio snapshot and lifecycle integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Portfolio snapshot and lifecycle tests
        run: pnpm exec tsx --test scripts/portfolio/snapshot.test.ts scripts/portfolio/lifecycle-registry.test.ts scripts/portfolio/create-snapshot.test.ts
