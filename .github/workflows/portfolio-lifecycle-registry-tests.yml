name: Portfolio Lifecycle Registry Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - portfolio/lifecycle-amendment-1-integration-harness
    paths:
      - "scripts/portfolio/lifecycle-registry.ts"
      - "scripts/portfolio/lifecycle-registry.json"
      - "scripts/portfolio/lifecycle-registry.test.ts"
      - ".github/workflows/portfolio-lifecycle-registry-tests.yml"

permissions:
  contents: read

jobs:
  lifecycle-registry-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: portfolio/lifecycle-amendment-1-integration-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lifecycle registry unit tests
        run: pnpm exec tsx --test scripts/portfolio/lifecycle-registry.test.ts
