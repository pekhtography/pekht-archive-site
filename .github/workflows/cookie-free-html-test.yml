name: PEKHTOGRAPHY cookie-free HTML profile test

on:
  push:
    branches:
      - main-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public X profile HTML
        run: |
          set -e
          curl -L --fail --silent --show-error --max-time 30 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://x.com/PEKHTOGRAPHY' > /tmp/profile.html

          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("/tmp/profile.html", "utf8");
          const checkpoint = "2097378431910772875";
          const matches = [...html.matchAll(/https?:\\/\\/(?:x\\.com|twitter\\.com)\\/[^"'<>\\s]+\\/status\\/(\\d+)/gi)];
          const ids = [...new Set(matches.map((m) => m[1]))];
          const newer = ids.filter((id) => BigInt(id) > BigInt(checkpoint));
          console.log("Cookie-free direct HTML profile");
          console.log("HTTP HTML bytes: " + Buffer.byteLength(html));
          console.log("Status URLs found: " + ids.length);
          console.log("Posts newer than current checkpoint: " + newer.length);
          console.log("Newest 10 IDs:");
          for (const id of newer.sort((a, b) => BigInt(b) > BigInt(a) ? 1 : -1).slice(0, 10)) console.log(id);
          NODE
