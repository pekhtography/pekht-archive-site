name: Portfolio Validation Lockfile Generator

on:
  push:
    branches:
      - portfolio/validators-0.2.1
    paths:
      - ".github/workflows/portfolio-validation-lockfile-generator.yml"

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Generate npm lockfile
        working-directory: validation/portfolio-validation-0.2.1
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-validation-lockfile
          path: validation/portfolio-validation-0.2.1/package-lock.json
          if-no-files-found: error
          retention-days: 1
