name: cookie-free oEmbed test

on:
  push:
    branches: [main-clean]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query X oEmbed
        run: |
          set -euo pipefail
          post_url='https://x.com/PEKHTography/status/2042907005795565709'
          endpoint="https://publish.twitter.com/oembed?url=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$post_url")"
          curl -L --fail --silent --show-error --max-time 30             -A 'Mozilla/5.0' "$endpoint" -o /tmp/oembed.json
          echo "Bytes: $(wc -c < /tmp/oembed.json)"
          python3 - <<'PY'
import json
d=json.load(open('/tmp/oembed.json'))
print("type:", d.get("type"))
print("author:", d.get("author_name"))
print("author_url:", d.get("author_url"))
print("url:", d.get("url"))
print("html_bytes:", len(d.get("html","")))
print("html_preview:", d.get("html","")[:500])
PY
