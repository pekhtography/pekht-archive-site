name: cookie-free Sotwe test

on:
  push:
    branches: [main-clean]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sotwe profile
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error --max-time 30             -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'             'https://www.sotwe.com/PEKHTography' > /tmp/profile.html
          echo "Profile bytes: $(wc -c < /tmp/profile.html)"
          echo "Sotwe status URLs:"
          grep -Eo 'https?://[^"<> ]*sotwe[^"<> ]*/PEKHTography/status/[0-9]+' /tmp/profile.html | sort -u | head -30 || true
          echo "X status URLs:"
          grep -Eo 'https?://(x|twitter).com/[^"<> ]+/status/[0-9]+' /tmp/profile.html | sort -u | head -30 || true
          echo "Raw status IDs:"
          grep -Eo '/status/[0-9]{15,}' /tmp/profile.html | sed 's#^/status/##' | sort -u | head -30 || true