name: Portfolio Real Gemini DISCOVER

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-real-discover-pilot
  cancel-in-progress: false

jobs:
  discover:
    name: DISCOVER one request for all 1000 Snapshot publications
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: portfolio/lifecycle-amendment-1-integration-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download approved immutable Snapshot Run #2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p snapshot
          gh run download 41331070359 \
            --repo "$GITHUB_REPOSITORY" \
            --name "pekhtography-portfolio-snapshot-41331070359" \
            --dir snapshot
          test -s snapshot/portfolio-snapshot.json
          echo "Downloaded approved Snapshot Run #2."

      - name: Test DISCOVER source mapping, evidence validation, and Gemini fallback chain
        run: pnpm exec tsx --test scripts/portfolio/discover-batches.test.ts scripts/portfolio/provider.test.ts

      - name: Run original single-request 1000-publication DISCOVER (live Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Do not set GEMINI_MODEL or GEMINI_FALLBACK_*: provider.ts uses its built-in five-model chain.
          PORTFOLIO_SNAPSHOT_PATH: snapshot/portfolio-snapshot.json
          PORTFOLIO_DISCOVER_RESULT_PATH: portfolio-discover-pilot-result.json
        run: pnpm exec tsx scripts/portfolio/discover-pilot.ts

      - name: Upload full DISCOVER response and model-call diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-discover-pilot-${{ github.run_id }}
          path: portfolio-discover-pilot-result.json
          if-no-files-found: error
          retention-days: 30
